name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run android

      # Con los secretos KEYSTORE_B64, KEYSTORE_PASSWORD, KEY_ALIAS y KEY_PASSWORD la APK sale
      # firmada siempre con la misma clave (se puede actualizar sin desinstalar ni perder datos).
      # Sin ellos sale una APK de pruebas, que NO se puede actualizar encima de otra compilación.
      - name: APK firmada
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/raciones.jks"
          cd android && chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/raciones.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/raciones.apk"
      - name: APK de pruebas (sin firma propia)
        if: ${{ env.KEYSTORE_B64 == '' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          cd android && chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/raciones.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: raciones-apk
          path: raciones.apk

      # La APK queda descargable sin iniciar sesión en:
      # https://github.com/<usuario>/<repo>/raw/apk/iocrino.apk (y raciones.apk, el nombre antiguo)
      - name: Publicar la APK en la rama apk
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ secrets.KEYSTORE_B64 != '' }}
        run: |
          mkdir pub && cp raciones.apk pub/ && cp raciones.apk pub/iocrino.apk && cd pub
          V=$(node -p "require('../package.json').version")
          if [ "$SIGNED" = "true" ]; then F="firmada"; else F="de pruebas (sin firma propia)"; fi
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          CERT=$("$AS" verify --print-certs raciones.apk | grep -m1 "SHA-256 digest" | sed 's/.*: //')
          echo "iocrino $V - APK $F - commit $GITHUB_SHA" > version.txt
          echo "Huella del certificado (SHA-256): $CERT" >> version.txt
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "iocrino $V ($F)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" apk
