<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f232b">
<title>iocrino</title>
<style>
:root{--bg:#1f232b;--card:#2a2f38;--card2:#363c48;--ink:#f3f5f8;--mut:#a4adbb;--line:#3a414d;--acc:#5ccbbb;--acc-ink:#0b2421;
--warn:#f2c069;--warn-bg:#3a2f14;--bad:#ffa0a6;--bad-bg:#47191e;--info-bg:#243538;
--in:#34552f;--in-b:#7acc6c;--hi:#5a4a1b;--hi-b:#f0b429;--vhi:#5e371a;--vhi-b:#f5873b;--lo:#5c2328;--lo-b:#ff5a5a;--old:#363c48;--old-b:#6b7280;--gline:#fff;color-scheme:dark}
html.light{--bg:#f4f6f9;--card:#ffffff;--card2:#e8ecf1;--ink:#1b1f27;--mut:#5d6675;--line:#d7dbe2;--acc:#1f9e8f;--acc-ink:#ffffff;--warn:#8a5a00;--warn-bg:#fff4d6;--bad:#b3261e;--bad-bg:#fde7e8;--info-bg:#e3f4f2;--in:#3f9a4c;--in-b:#2e8a3c;--hi:#c98e00;--hi-b:#b07d00;--vhi:#d9661c;--vhi-b:#c4561a;--lo:#d23b3f;--lo-b:#c62828;--old:#8a93a3;--old-b:#6b7280;--gline:#1b1f27;color-scheme:light}
html.night{--bg:#000;--card:#0f1114;--card2:#1a1d22;--ink:#c9ced6;--mut:#7d8592;--line:#23272e;--acc:#3f9a8f;--gline:#c9ced6}
html.night body{font-size:105%}
html.night header .logo{opacity:.7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 18px 8px}
header h1{font-size:32px;font-weight:700;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:10px}
header .logo{height:34px;width:auto}
main{max-width:640px;margin:0 auto;padding:6px 14px calc(100px + env(safe-area-inset-bottom))}
body.hassum main{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 10px;font-weight:650}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
input.n{width:84px;text-align:right;font-variant-numeric:tabular-nums}
input.big{font-size:34px;font-weight:700;width:140px;text-align:center}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
button{font:inherit;border:none;background:var(--card2);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:46px;cursor:pointer}
button.pri{background:var(--acc);color:var(--acc-ink);font-weight:700}
button.big{width:100%;font-size:18px;min-height:58px;margin:2px 0 12px;border-radius:16px}
button.ghost{background:none;color:var(--acc);padding:10px 6px}
button.x{background:none;color:var(--mut);min-width:40px;padding:6px;font-size:18px}
button:disabled{opacity:.5}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:8px 16px;min-height:42px}
.chip.on{background:var(--ink);color:var(--bg);font-weight:650}
.chips.slots{margin:0 0 12px;flex-wrap:nowrap}
.chips.slots .chip{flex:1;padding:8px 2px;min-width:0;font-size:15px;letter-spacing:-.01em}
#gtr{flex-wrap:nowrap}
#gtr .chip{flex:1;padding:8px 0;min-width:0;font-size:20px}
.lab{font-size:13px;color:var(--mut);margin:14px 0 6px}
/* glucosa */
.gc{--c:var(--old);--b:var(--old-b);background:var(--c);color:#fff;position:relative;overflow:hidden;text-align:left;width:100%;display:block}
.gc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:var(--b)}
.gc.in{--c:var(--in);--b:var(--in-b)}.gc.high{--c:var(--hi);--b:var(--hi-b)}.gc.vhigh{--c:var(--vhi);--b:var(--vhi-b)}.gc.low{--c:var(--lo);--b:var(--lo-b)}
.gcard{border-radius:18px;padding:14px 18px 14px 30px;margin-bottom:6px}
.gcard .gl{display:block;font-size:21px;font-weight:600}
.gcard .gv{display:flex;align-items:flex-end;gap:10px;line-height:1;margin-top:2px}
.gcard .num{font-size:88px;font-weight:800;letter-spacing:-.03em}
.gcard .arr{font-size:56px;font-weight:300;margin-bottom:26px}
.gcard .un{font-size:21px;margin-bottom:10px}
.gcard .gage{display:block;font-size:14px;opacity:.85;margin-top:8px}
.gcard.busy .gage::after{content:" · leyendo…"}
.gstrip{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:14px;padding:10px 14px 10px 24px;margin-bottom:10px;min-height:0}
.gstrip::before{width:8px}
.gstrip b{font-size:30px;font-weight:800}
.gstrip .sarr{font-size:24px}
.gstrip .sage{font-size:13px;opacity:.85;text-align:right}
.subrow{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px;min-height:40px}
.lerr{font-size:13px;color:var(--warn);margin:0 4px 8px}
/* gráfica */
.chartc{padding:10px 8px 6px}
.gchart{width:100%;height:auto;display:block}
.gchart .band{fill:rgba(122,204,108,.17)}
.gchart .grid{stroke:#3b424e;stroke-width:1}
.gchart .yl,.gchart .xl{fill:var(--mut);font-size:11px}
.gchart .tick{stroke:var(--mut);stroke-width:1.5}
.gchart .tickd{fill:var(--mut)}
.gchart .hypo{stroke:#ff5a5a;stroke-width:1.6;stroke-dasharray:6 5}
.gchart .alto{stroke:#f5a623;stroke-width:1.6;stroke-dasharray:6 5}
.gchart .gline{fill:none;stroke:var(--gline);stroke-width:2.8;stroke-linejoin:round;stroke-linecap:round}
.gchart .gpt{fill:var(--gline)}
.gchart .mdot{fill:var(--gline);stroke:var(--card);stroke-width:2}
.gchart .dose{fill:var(--acc)}
.gchart .dl{fill:var(--acc);font-size:10px;font-weight:700}
.gchart .cur{stroke:#fff;stroke-width:2.5;fill:var(--in-b)}
.gchart .cur.high{fill:var(--hi-b)}.gchart .cur.vhigh{fill:var(--vhi-b)}.gchart .cur.low{fill:var(--lo-b)}.gchart .cur.old,.gchart .cur.none{fill:var(--old-b)}
.gchart .empty{fill:var(--mut);font-size:13px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0}
.kv b{font-size:19px}
/* comida */
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tools button{display:flex;align-items:center;gap:7px}
.tools svg{width:20px;height:20px}
.item{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
#items .item:first-child{border-top:none}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:550;overflow-wrap:anywhere}
.item .nm small,.mut{color:var(--mut);font-size:13px}
.hc{font-variant-numeric:tabular-nums;min-width:58px;text-align:right;font-weight:650}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:17px}
.tot b{font-size:24px}
table.bk{width:100%;border-collapse:collapse;margin:10px 0}
table.bk td{padding:7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
table.bk td:last-child{text-align:right;font-weight:650;white-space:nowrap}
table.bk small{color:var(--mut);display:block}
.dose{background:var(--info-bg);border-radius:14px;padding:12px;text-align:center;margin:8px 0}
.dose b{font-size:42px;line-height:1.1;display:block}
.note{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--bad);font-weight:550}
.note.info{background:var(--info-bg)}
.fine{font-size:12px;color:var(--mut);margin-top:10px}
.list{margin:6px 0 0;border-radius:12px;overflow:hidden}
.list button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border-radius:0;background:var(--card2);border-top:1px solid var(--line)}
.list button:first-child{border-top:none}
.list button span:last-child{color:var(--mut);white-space:nowrap}
#sum{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;display:flex;justify-content:space-between;align-items:center;max-width:616px;margin:0 auto;background:var(--acc);color:var(--acc-ink);border-radius:16px;padding:10px 18px;box-shadow:0 6px 22px rgba(0,0,0,.45)}
#sum .sd{font-size:24px;font-weight:800}
#sum[hidden]{display:none}
nav{position:fixed;left:0;right:0;bottom:0;background:#171a20;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:160px;background:none;border-radius:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:13px;min-height:66px}
nav button svg{width:28px;height:28px}
nav button.on{color:var(--ink);font-weight:650}
dialog{border:none;border-radius:18px;background:var(--card);color:var(--ink);padding:18px;width:min(560px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 10px;font-size:19px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
video{width:100%;border-radius:12px;background:#000;max-height:40vh}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.day{font-size:13px;color:var(--mut);margin:16px 4px 6px;font-weight:650}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbox{position:relative}
.sbox svg{position:absolute;left:14px;top:50%;width:22px;height:22px;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.sbox input{padding-left:46px;min-height:54px;font-size:17px;border-radius:14px}
.ways{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.way{display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border-radius:14px;min-height:64px}
.way svg{width:26px;height:26px;flex:none;color:var(--acc)}
.way b{display:block;font-size:15px}
.way small{display:block;font-size:12px;color:var(--mut);line-height:1.25}
.item2{padding:10px 0;border-top:1px solid var(--line)}
#items .item2:first-child{border-top:none;padding-top:0}
.it-top{display:flex;align-items:flex-start;gap:8px}
.it-top .nm{flex:1;min-width:0}
.it-top .nm b{display:block;font-weight:600;overflow-wrap:anywhere}
.it-top .nm small{color:var(--mut);font-size:13px}
.it-qty{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.qty{display:flex;align-items:center;gap:6px;margin:0;color:var(--mut);font-size:14px}
.qty input.n{width:84px;font-size:18px;font-weight:650}
.it-qty .hc{margin-left:auto;font-size:16px}
.chip.mini{min-height:36px;padding:6px 12px;font-size:13px}
.estm{color:var(--warn)}
.basalrow small{display:block;color:var(--mut);font-size:13px}
.basalrow{align-items:center}
.hc.lenta{color:#b48cff}
.gchart .dose.basal{fill:#b48cff}
.gchart .dl.basal{fill:#b48cff}
.lrow{border-left:4px solid var(--old-b);padding:6px 10px;margin:8px 0;font-size:14px}
.lrow b{display:block;font-size:15px}
.lrow.bien{border-color:var(--in-b)}.lrow.alto{border-color:var(--hi-b)}.lrow.bajo{border-color:var(--lo-b)}
.wzdots{display:flex;gap:6px;margin-bottom:12px}
.wzdots span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.wzdots span.on{background:var(--acc)}
.wz .chips{margin-bottom:4px}
.adv{border-top:1px solid var(--line);padding:8px 0}
.adv:first-of-type{border-top:none}
.adv p{margin:2px 0 0;font-size:14px;color:var(--ink)}
.adv .kv span{display:flex;align-items:center;gap:8px}
.adv.mas .kv b,.adv.menos .kv b{color:var(--hi-b)}
.adv.menos-hipo .kv b{color:var(--lo-b)}
.adv.ok .kv b{color:var(--in-b)}
.gd{border-top:1px solid var(--line);padding:8px 0}
.gd summary{font-weight:650;cursor:pointer;padding:4px 0;color:var(--acc)}
.gd p,.gd li{font-size:15px;line-height:1.5}
.gd ul{padding-left:20px;margin:6px 0}
.basalrow .ok{color:var(--in-b);font-weight:700}
.chip.mini.pri{background:var(--acc);color:var(--acc-ink);font-weight:700}
.lowbtn{width:100%;margin:0 0 10px;background:transparent;border:1px solid rgba(255,90,90,.55);color:#ff8a8a;font-weight:600;border-radius:14px;min-height:42px}
.lowbtn.hot{background:var(--lo-b);color:#2a0a0c}
.note.hipo .row{margin-top:8px}
.note .row{margin-top:8px}
.tir{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:10px 0}
.how{margin-top:12px;font-size:14px;color:var(--mut)}
.how summary{color:var(--acc);cursor:pointer;padding:6px 0;font-size:15px}
.how ol{padding-left:20px;margin:6px 0}
.how li{margin:4px 0}
.how b{color:var(--ink)}
.coach{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;margin:0 0 10px;font-size:15px;background:var(--card)}
.coach .ci{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--card2);color:var(--mut)}
.coach.ok .ci{background:var(--in-b);color:#10240c}.coach.warn .ci{background:var(--hi-b);color:#2a1d00}.coach.bad .ci{background:var(--lo-b);color:#2a0a0c}.coach.info .ci{background:var(--acc);color:var(--acc-ink)}
.coach.big{font-size:17px;padding:14px;margin-bottom:12px}
.tipline{display:block;width:100%;text-align:left;background:var(--card);border-radius:14px;padding:10px 12px;margin:0 0 10px;min-height:0}
.tipline .tk,.tipi .tk{display:block;font-size:12px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tipline .tx{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;color:var(--ink)}
.tipi{border-top:1px solid var(--line);padding:9px 0;font-size:15px;line-height:1.45}
.tipi:first-of-type{border-top:none;padding-top:0}
.ig{width:100%;height:auto;display:block;margin:6px 0;font-family:inherit}
.igl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.igl button{text-align:left;font-weight:600;font-size:14px}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach{background:var(--card2);border-radius:12px;padding:10px;opacity:.55}
.ach.ok{opacity:1;box-shadow:inset 0 0 0 1px var(--acc)}
.ach .am{font-size:20px;display:block}
.ach b{display:block;font-size:14px}.ach small{color:var(--mut);font-size:12px}
nav button{font-size:12px}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;background:none;min-height:40px;border-radius:10px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--card2);color:var(--ink)}
.ways3{display:flex;gap:8px;margin-bottom:12px}
.ways3 button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;padding:10px 4px;min-height:64px}
.ways3 svg{width:24px;height:24px;color:var(--acc)}
details.sec{padding:0}
details.sec>summary{list-style:none;cursor:pointer;padding:16px;font-size:16px;font-weight:650;display:flex;justify-content:space-between;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"›";color:var(--mut);font-size:22px;transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(90deg)}
details.sec[open]{padding:0 16px 16px}
details.sec[open]>summary{padding:16px 0 6px}
.moodc{background:var(--card);border-radius:14px;padding:10px 12px;margin:0 0 10px}
.moodc .mq{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600}
.moodc .mq .x{min-height:32px;font-size:15px}
.faces{display:flex;gap:6px;justify-content:space-between;margin:6px 0}
.face{flex:1;font-size:28px;padding:6px 0;min-height:52px;background:var(--card2);border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.face small{font-size:11px;color:var(--mut)}
.face.on{background:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.face.on small{color:var(--acc-ink)}
.support{border:1px solid rgba(92,203,187,.5)}
.support p,.support li{font-size:15px;line-height:1.5}.support ul{padding-left:20px;margin:6px 0}
.breath{position:relative;height:220px;display:grid;place-items:center}
.bcirc{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--acc) 0,rgba(92,203,187,.25) 70%);animation:breath 8s ease-in-out infinite}
.btxt{position:absolute;font-size:18px;font-weight:650;color:var(--ink)}
@keyframes breath{0%,100%{transform:scale(.55)}50%{transform:scale(1.15)}}
b.lo{color:var(--lo-b)}b.in{color:var(--in-b)}b.hi{color:var(--hi-b)}
#sum small{display:block;font-size:12px;font-weight:600;opacity:.8}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 10px;counter-reset:none}
.steps li{flex:1;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);background:var(--card);border-radius:12px;padding:6px 8px;line-height:1.2}
.steps li span{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:var(--card2);color:var(--mut)}
.steps li.on{color:var(--ink)}.steps li.on span{background:var(--acc);color:var(--acc-ink)}
.steps li.done span{background:var(--in-b);color:#10240c}
body.hassum #toast{bottom:calc(170px + env(safe-area-inset-bottom))}
#res[hidden]{display:none}
.micbtn{display:flex;align-items:center;gap:8px;margin-top:8px}.micbtn svg{width:20px;height:20px;color:var(--acc)}
html.light nav{background:#fff;box-shadow:0 -1px 0 var(--line)}html.light nav button.on{color:var(--acc)}html.night nav{background:#000}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg);z-index:30;pointer-events:none}
.qrow{display:flex;align-items:center;gap:10px}.qrow input{font-size:28px;font-weight:700;text-align:center}.qrow span{font-size:20px;color:var(--mut);min-width:34px}
.qprev{margin:12px 0 4px;padding:12px;border-radius:12px;background:var(--info-bg);font-size:17px;text-align:center}
.corr{border:1px solid var(--hi-b)}.corr .kv small{display:block;color:var(--mut);font-size:13px;margin-top:2px}.corr .cu{font-size:30px;white-space:nowrap}
</style>
</head>
<body>
<header><h1><svg class="logo" viewBox="70 70 372 372" aria-hidden="true"><circle cx="256" cy="256" r="178" fill="#5ccbbb"/><circle cx="256" cy="256" r="140" fill="none" stroke="#479089" stroke-width="14"/><path d="M256 150L316.3 252.5A70 70 0 1 1 195.7 252.5Z" fill="#fff"/></svg>iocrino</h1></header>
<main id="view"></main>
<button id="sum" data-act="tores" hidden></button>
<nav id="nav">
